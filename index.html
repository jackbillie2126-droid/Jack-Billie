    <!-- Primary Page Title & Meta Description for ScoutTool Branded Search -->
    <title>ScoutTool — Email Finder, Email Scraper &amp; Lead Generation Tool</title>
    <meta name="description" content="ScoutTool (also known as Scoutool or Scout Tool) is a web-based email scraper, email finder, and lead generation tool that discovers verified public business contacts from websites." />

    <meta name="author" content="ScoutTool" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Canonical URL (dynamically synchronized to active deployment domain) -->

    <meta property="og:url" id="scout-og-url" content="https://scouttool.vercel.app/" />
    <meta property="og:title" content="ScoutTool — Email Finder, Email Scraper &amp; Lead Generation Tool" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:image" id="scout-og-image" content="/icon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ScoutTool Logo - Public Website Email Finder and Lead Generation Tool" />

    <!-- Twitter / X Cards -->

    <meta name="twitter:url" id="scout-tw-url" content="https://scouttool.vercel.app/" />
    <meta name="twitter:title" content="ScoutTool — Email Finder, Email Scraper &amp; Lead Generation Tool" />
    <meta name="twitter:description" content="Discover public business contacts, extract emails from websites, and generate verified lead lists with ScoutTool (Scout Tool / Scoutool)." />
    <meta name="twitter:image" content="/icon.svg" />
    <meta name="twitter:image:alt" content="ScoutTool Logo - Website Email Scraper &amp; Lead Discovery" />

    <!-- Dynamic SEO Canonical & Origin Resolver -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location && window.location.origin) {
            var origin = window.location.origin;
            var fullUrl = origin + (window.location.pathname || '/');
            var can = document.getElementById('scout-canonical');
            if (can) can.setAttribute('href', fullUrl);
            var og = document.getElementById('scout-og-url');
            if (og) og.setAttribute('content', fullUrl);
            var tw = document.getElementById('scout-tw-url');
            if (tw) tw.setAttribute('content', fullUrl);
            var ogImg = document.getElementById('scout-og-image');
            if (ogImg) ogImg.setAttribute('content', origin + '/icon.svg');
          }
        } catch (e) {}
      })();
    </script>

              "name": "What is ScoutTool?",

            },
            {
              "@type": "Question",
              "name": "How does the ScoutTool email scraper work?",
              "acceptedAnswer": {

              "@type": "Question",

  <body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Interactive App Mount Target with Official ScoutTool Logo Splash -->
    <div id="root">
      <div id="scout-app-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090A0F; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <!-- Official ScoutTool App Logo -->
          <div style="position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border: 1px solid #4338ca; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.45);">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="#6366f1"></polygon>
            </svg>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">ScoutTool</div>
            <div style="font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 4px;">Lead Intelligence &amp; Outreach Engine</div>
          </div>
          <!-- Pulse Loader Indicator -->
          <div style="margin-top: 8px; width: 44px; height: 3px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; position: relative;">
            <div style="position: absolute; left: 0; top: 0; height: 100%; width: 50%; background: #6366f1; border-radius: 999px; animation: scout-pulse 1.2s ease-in-out infinite;"></div>
          </div>
        </div>
        <style>
          @keyframes scout-pulse {
            0% { left: -50%; width: 50%; }
            50% { left: 25%; width: 50%; }
            100% { left: 100%; width: 50%; }
          }
        </style>
      </div>
    </div>

    <!-- Fallback for JavaScript-Disabled Crawlers -->
    <noscript>
      <div style="max-width: 800px; margin: 20px auto; padding: 20px; background-color: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; font-family: sans-serif;">

        <p>ScoutTool is an online email scraper, email finder, and lead generation tool. Please enable JavaScript in your browser to use the full interactive application.</p>
      </div>
