[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/scrape-emails"
  to = "/.netlify/functions/scrape-emails"
  status = 200

[[redirects]]
  from = "/api/scan-website"
  to = "/.netlify/functions/scrape-emails"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
